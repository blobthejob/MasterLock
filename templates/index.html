<!DOCTYPE html>
<html>
<script>
console.log("HTML Version: 5")
</script>
<head>
    <title>Master Lock</title>

    <style>
       
	body {
	    background: black;
 	   color: #440033;
 	   margin: 0;
	    min-height: 100vh;
	    font-family: Arial, sans-serif;
	}
   
	.container {
	    text-align: center;
	    width: 100%;
	    max-height: 100vh;
	    overflow-y: auto;
	}

        input {
            width: 600px;
            max-width: 70vw;
            padding: 15px;
            background: #111;
            color: white;
            border: 2px solid #333;
            outline: none;
            font-size: 28px;
        }

        input:focus {
            border-color: #777;
        }
	
	#commandForm {
 	   position: sticky;
  	  top: 0;
  	  z-index: 1000;
  	  background: black;
  	  padding: 12px 0;
	}

        button {
            padding: 15px 20px;
            margin-left: 8px;
            background: #222;
            color: white;
            border: 2px solid #333;
            cursor: pointer;
            font-size: 22px;
        }

        button:hover {
            background: #333;
        }

        .result {
            margin-top: 30px;
            font-size: 24px;
    	    white-space: pre-line;
        }

        #lockedScreen {
            display: none;
            text-align: center;
        }

        #lockedScreen input {
            display: block;
            margin: 25px auto;
        }

        #lockedScreen button {
            margin-left: 0;
        }
    </style>
</head>

<body>
<div class="container">

    <div id="normalScreen">

        <form id="commandForm">

            <input
                id="code"
                name="code"
                placeholder="Enter command..."
                autofocus
                autocomplete="off"
            >

            <button type="submit">Go</button>

            <button type="button" id="mic">Listen</button>

        </form>

        <div id="result" class="result"></div>

    </div>


    <div id="lockedScreen">

        <h1>MASTER LOCK</h1>

        <h2>LOCKED</h2>

        <input
            id="unlockCode"
            placeholder="Enter unlock code..."
            autocomplete="off"
        >

        <button id="unlockButton">UNLOCK</button>

        <div id="lockResult" class="result"></div>

    </div>

</div>


<script>

const form = document.getElementById("commandForm");
const input = document.getElementById("code");
const result = document.getElementById("result");
const mic = document.getElementById("mic");

const normalScreen = document.getElementById("normalScreen");
const lockedScreen = document.getElementById("lockedScreen");

const unlockCode = document.getElementById("unlockCode");
const unlockButton = document.getElementById("unlockButton");
const lockResult = document.getElementById("lockResult");

// #command history
let commandHistory = JSON.parse(
    localStorage.getItem("masterCommandHistory") || "[]"
);
let historyIndex = commandHistory.length;

const savedBg = localStorage.getItem("master_bg");
const savedText = localStorage.getItem("master_text");
const savedBtn = localStorage.getItem("master_btn");
const savedInput = localStorage.getItem("master_input");
let unlockedCodes = JSON.parse(
    localStorage.getItem("masterUnlocked") || "[]"
);
const startingCodes = [
    "nos ossos que aqui estamos pelos vossos esperamos"
];
startingCodes.forEach(code => {
    if (!unlockedCodes.includes(code)) {
        unlockedCodes.push(code);
    }

});

localStorage.setItem(
    "masterUnlocked",
    JSON.stringify(unlockedCodes)
);

if (savedBg) {
    document.body.style.backgroundColor = savedBg;
}

if (savedText) {
    document.body.style.color = savedText;

    document.querySelectorAll("*").forEach(element => {
        element.style.color = savedText;
    });
}

if (savedBtn) {
    document.querySelectorAll("button").forEach(button => {
        button.style.backgroundColor = savedBtn;
    });
}

if (savedInput) {
    document.querySelectorAll("input").forEach(input => {
        input.style.backgroundColor = savedInput;
    });
}

function showLocked() {

    localStorage.setItem("masterLockLocked", "true");

    normalScreen.style.display = "none";
    lockedScreen.style.display = "block";

    unlockCode.focus();
}


function showNormal() {

    localStorage.removeItem("masterLockLocked");

    lockedScreen.style.display = "none";
    normalScreen.style.display = "block";

    input.value = "";
    input.focus();
}


if (localStorage.getItem("masterLockLocked") === "true") {
    showLocked();
}


form.addEventListener("submit", async event => {

    event.preventDefault();

    const submittedCommand = input.value.trim();

    // #save command history

    if (submittedCommand) {

        commandHistory.push(submittedCommand);

        if (commandHistory.length > 100) {
            commandHistory.shift();
        }

        localStorage.setItem(
            "masterCommandHistory",
            JSON.stringify(commandHistory)
        );

    }

    historyIndex = commandHistory.length;

    // #clear command

    if (submittedCommand.toLowerCase() === "clear") {

        result.textContent = "";
        input.value = "";

        return;
    }

    // #history command

    if (submittedCommand.toLowerCase() === "history") {

        result.textContent = commandHistory.length
            ? commandHistory.join("\n")
            : "No command history yet.";

        input.value = "";

        return;
    }

    result.textContent = "";

    const enteredCode = input.value.trim().toLowerCase();

    const data = new FormData(form);

data.append(
    "unlocked",
    JSON.stringify(unlockedCodes)
);

const response = await fetch("/", {
    method: "POST",
    body: data
});

    const answer = await response.json();

    input.value = "";
    if (answer.type === "lock") {
        showLocked();
        return;
    }

    if (answer.type === "url") {
        window.open(answer.url, "_blank");
        return;
    }
   if (answer.type === "css") {

    if (answer.target === "bg") {
        document.body.style.backgroundColor = answer.value;
        localStorage.setItem("master_bg", answer.value);
    }

    if (answer.target === "text") {
        document.body.style.color = answer.value;

        document.querySelectorAll("*").forEach(element => {
            element.style.color = answer.value;
        });

        localStorage.setItem("master_text", answer.value);
    }

    if (answer.target === "btn") {
        document.querySelectorAll("button").forEach(button => {
            button.style.backgroundColor = answer.value;
        });

        localStorage.setItem("master_btn", answer.value);
    }

    if (answer.target === "input") {
        document.querySelectorAll("input").forEach(input => {
            input.style.backgroundColor = answer.value;
        });

        localStorage.setItem("master_input", answer.value);
    }
}

// #spy animation - all results
if (answer.type === "result") {
    const text = answer.text;
    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&*";
    result.textContent = "";
    let position = 0;
    const interval = setInterval(() => {
        let display = "";
        for (let i = 0; i < text.length; i++) {
            if (i < position) {
                display += text[i];
            } else if (text[i] === "\n" || text[i] === " ") {
                display += text[i];
            } else {
                display += characters[
                    Math.floor(Math.random() * characters.length)
                ];
            }
        }
        result.textContent = display;
        position += 2;
        if (position >= text.length) {
            clearInterval(interval);
            result.textContent = text;
        }
    }, 15);
}

if (answer.type === "code") {

    result.textContent = answer.text;

    answer.unlocks.forEach(code => {

        if (!unlockedCodes.includes(code)) {
            unlockedCodes.push(code);
        }

    });

    localStorage.setItem(
        "masterUnlocked",
        JSON.stringify(unlockedCodes)
    );

    return;
}

if (answer.type === "decrypt") {

    const text = answer.text;

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";

    let position = 0;

    result.textContent = "";

    const interval = setInterval(() => {

        let display = "";

        for (let i = 0; i < text.length; i++) {

            if (i < position) {
                display += text[i];
            } else if (text[i] === " ") {
                display += " ";
            } else {
                display += characters[
                    Math.floor(Math.random() * characters.length)
                ];
            }
        }

        result.textContent = display;

        position++;

        if (position > text.length) {
            clearInterval(interval);
            result.textContent = text;
        }

    }, 50);
}

});


unlockButton.addEventListener("click", async () => {

    const code = unlockCode.value.trim().toLowerCase();

    if (!code) {
        return;
    }

    const data = new FormData();

    data.append("code", code);
    data.append("locked", "true");

    const response = await fetch("/", {
        method: "POST",
        body: data
    });

    const answer = await response.json();

    if (answer.type === "reset") {
        lockResult.textContent = "RESET";

        localStorage.removeItem("masterUnlocked");

        location.reload();

        return;
    }

    if (answer.type === "unlock") {

        lockResult.textContent = "UNLOCKED";

        setTimeout(() => {
            showNormal();
        }, 500);

        return;
    }

    lockResult.textContent = "INCORRECT CODE";
    unlockCode.value = "";
    unlockCode.focus();

});

unlockCode.addEventListener("keydown", event => {

    if (event.key === "Enter") {
        unlockButton.click();
    }

});

/* #microphone */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let listening = false;

if (SpeechRecognition) {

    mic.addEventListener("click", function() {

        console.log("MIC BUTTON CLICKED");

        if (listening) {

            console.log("STOPPING");

            if (recognition) {
                recognition.stop();
            }

            return;
        }

        console.log("CREATING RECOGNITION");

        recognition = new SpeechRecognition();

        recognition.lang = "en-GB";
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = function() {

            listening = true;

            mic.textContent = "Listening...";

            console.log("MICROPHONE STARTED");

        };

        recognition.onresult = function(event) {

            const text =
                event.results[0][0].transcript;

            console.log("HEARD:", text);

            input.value = text;

        };

        recognition.onerror = function(event) {

            console.error(
                "MICROPHONE ERROR:",
                event.error
            );

            listening = false;

            mic.textContent = "Listen";

        };

        recognition.onend = function() {

            console.log("MICROPHONE ENDED");

            listening = false;

            mic.textContent = "Listen";

            recognition = null;

        };

        try {

            recognition.start();

            console.log("STARTING");

        } catch (error) {

            console.error(
                "START ERROR:",
                error
            );

            listening = false;

            mic.textContent = "Listen";

            recognition = null;

        }

    });

} else {

    mic.disabled = true;

    mic.textContent = "No mic";

    console.error(
        "SpeechRecognition is not supported."
    );

}

// #keyboard shortcuts

input.addEventListener("keydown", event => {

    if (event.key === "ArrowUp") {

        event.preventDefault();

        if (commandHistory.length === 0) {
            return;
        }

        historyIndex = Math.max(0, historyIndex - 1);

        input.value = commandHistory[historyIndex];

    }

    else if (event.key === "ArrowDown") {

        event.preventDefault();

        if (commandHistory.length === 0) {
            return;
        }

        historyIndex = Math.min(
            commandHistory.length,
            historyIndex + 1
        );

        input.value = historyIndex === commandHistory.length
            ? ""
            : commandHistory[historyIndex];

    }

    else if (event.key === "Escape") {

        input.value = "";
        historyIndex = commandHistory.length;

    }

});

</script>

</body>
</html>
