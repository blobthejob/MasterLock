<script>
(function () {
    "use strict";

    /* ============================================================
       STYLE PRESETS  -  type  style <name>  to use one
       ------------------------------------------------------------
       Only bg, text and accent are required. Everything else is
       optional and falls back to a sensible default:

         bg         page background          text       main text colour
         accent     borders and lines        panel      command bar background
         inputBg / inputText / inputBorder / inputFocus
         btnBg / btnText / btnBorder / btnHover
         codeBg / codeText                   canvasBg   game board background
         font       font-family              glow       text glow colour
         bgImage    CSS gradient over the background

       TO ADD YOUR OWN: copy a block below, rename it, change colours.
       ============================================================ */
    const STYLE_PRESETS = {

        dark: {
            bg: "#121212", text: "#e8e8e8", accent: "#3a3a3a",
            inputBg: "#1e1e1e", btnBg: "#2a2a2a", btnHover: "#3d3d3d",
            codeBg: "#2a2a2a"
        },

        light: {
            bg: "#f4f4f4", text: "#1a1a1a", accent: "#b8b8b8",
            inputBg: "#ffffff", inputText: "#111111",
            btnBg: "#e4e4e4", btnText: "#111111", btnHover: "#d0d0d0",
            codeBg: "#e0e0e0", codeText: "#111111",
            canvasBg: "#1c1c1c"
        },

        halloween: {
            bg: "#120800", text: "#ff7518", accent: "#7b2fa8",
            inputBg: "#1f0f00", inputText: "#ffb347", inputBorder: "#ff7518",
            inputFocus: "#b266ff",
            btnBg: "#2a1038", btnText: "#ff9a3c", btnBorder: "#ff7518",
            btnHover: "#4b1d6b",
            codeBg: "#2a1038", codeText: "#ffb347",
            font: "Georgia, 'Times New Roman', serif",
            glow: "#ff7518",
            bgImage: "radial-gradient(circle at 50% 0%, #3a1450 0%, #120800 65%)"
        },

        hacker: {
            bg: "#000000", text: "#00ff41", accent: "#008f11",
            inputBg: "#001a00", btnBg: "#002b00", btnHover: "#005c00",
            codeBg: "#002b00",
            font: "'Courier New', Courier, monospace",
            glow: "#00ff41"
        },

	ocean: {
            bgImage: "linear-gradient(to bottom, #0d1b4d 0%, #000000 80%)",
	    text: "#00ffff", accent: "#00118f",
            inputBg: "#00001a", btnBg: "#00002b", btnHover: "#00005c",
            codeBg: "#00002b",
            font: "'Courier New', Courier, monospace",
            glow: "#0041ff"
        },


        future: {
            bg: "#050816", text: "#7df9ff", accent: "#00e5ff",
            inputBg: "#0a1030", inputText: "#e0faff", inputFocus: "#ff2bd6",
            btnBg: "#0a1030", btnHover: "#14307a",
            codeBg: "#0a1030",
            font: "'Trebuchet MS', 'Segoe UI', sans-serif",
            glow: "#00e5ff",
            bgImage: "radial-gradient(ellipse at top, #0d1b4d 0%, #050816 60%)"
        },

        retro: {
            bg: "#2a170c", text: "#f2c14e", accent: "#d9531e",
            inputBg: "#3b2212", inputText: "#fbe3a0", inputFocus: "#f2c14e",
            btnBg: "#d9531e", btnText: "#2a170c", btnHover: "#f2c14e",
            codeBg: "#3b2212", codeText: "#fbe3a0",
            font: "'Trebuchet MS', 'Gill Sans', sans-serif"
        }

        // , mystyle: { bg: "#000033", text: "#ffffff", accent: "#6666ff" }
    };

    const STORAGE_KEY = "master_style";
    const STYLE_TAG_ID = "masterStyleTheme";
    const OLD_COLOUR_KEYS = ["master_bg", "master_text", "master_btn", "master_input"];
    const DEFAULT_ALIASES = ["default", "reset", "off", "original", "normal"];

    function buildCss(p) {
        const bg = p.bg;
        const text = p.text;
        const accent = p.accent || text;
        const panel = p.panel || bg;
        const inputBg = p.inputBg || bg;
        const inputText = p.inputText || text;
        const inputBorder = p.inputBorder || accent;
        const inputFocus = p.inputFocus || text;
        const btnBg = p.btnBg || bg;
        const btnText = p.btnText || text;
        const btnBorder = p.btnBorder || accent;
        const btnHover = p.btnHover || accent;
        const codeBg = p.codeBg || bg;
        const codeText = p.codeText || text;
        const canvasBg = p.canvasBg || "#111";

        let css = "";

        css += "body { background-color: " + bg + "; color: " + text + ";";
        if (p.bgImage) {
            css += " background-image: " + p.bgImage + ";" +
                   " background-repeat: no-repeat;" +
                   " background-attachment: fixed;";
        }
        if (p.font) css += " font-family: " + p.font + ";";
        css += " }\n";

        if (p.font) css += "input, button { font-family: inherit; }\n";

        if (p.glow) {
            css += "body, input, button { text-shadow: 0 0 6px " + p.glow + "; }\n";
        }

        css += "input { background: " + inputBg + "; color: " + inputText +
               "; border: 2px solid " + inputBorder + "; }\n";
        css += "input:focus { border-color: " + inputFocus + "; }\n";
        css += "#commandForm { background: " + panel + "; }\n";
        css += "button { background: " + btnBg + "; color: " + btnText +
               "; border: 2px solid " + btnBorder + "; }\n";
        css += "button:hover { background: " + btnHover + "; }\n";
        css += "#result code { background: " + codeBg + "; color: " + codeText + "; }\n";
        css += "#result hr { border-top-color: " + accent + "; }\n";
        css += "#drawMenu, #drawStatus, #gameMenu, #gameStatus, " +
               "#cameraMenu, #cameraStatus { color: " + text + "; }\n";
        css += "#drawCanvas { border-color: " + accent + "; }\n";
        css += "#gameCanvas { background: " + canvasBg + "; border-color: " + accent + "; }\n";
        css += "#photoControls { background: " + panel + "; }\n";
        css += ".photo-card { border-color: " + accent + "; }\n";

        return css;
    }

    function setThemeColour(colour) {
        let meta = document.querySelector('meta[name="theme-color"]');

        if (!colour) {
            if (meta) meta.remove();
            return;
        }

        if (!meta) {
            meta = document.createElement("meta");
            meta.name = "theme-color";
            document.head.appendChild(meta);
        }

        meta.content = colour;
    }

    function show(name) {
        let tag = document.getElementById(STYLE_TAG_ID);
        const preset = STYLE_PRESETS[name];

        if (!preset) {
            if (tag) tag.remove();
            setThemeColour(null);
            return;
        }

        if (!tag) {
            tag = document.createElement("style");
            tag.id = STYLE_TAG_ID;
            document.head.appendChild(tag);
        }

        tag.textContent = buildCss(preset);
        setThemeColour(preset.bg);
    }

    // Old bg / text / btn / input commands paint inline styles that would
    // hide a preset, so a preset clears them first.
    function clearColourOverrides() {
        OLD_COLOUR_KEYS.forEach(key => localStorage.removeItem(key));

        document.body.style.backgroundColor = "";
        document.body.style.backgroundImage = "";
        document.body.style.color = "";

        document.querySelectorAll("*").forEach(element => {
            element.style.color = "";
        });

        document.querySelectorAll("button, input").forEach(element => {
            element.style.backgroundColor = "";
        });
    }

    function current() {
        const saved = localStorage.getItem(STORAGE_KEY);
        return STYLE_PRESETS[saved] ? saved : "default";
    }

    // Returns the style name that was applied, or null if it doesn't exist.
    function apply(requested) {
        const name = String(requested || "").trim().toLowerCase();

        if (DEFAULT_ALIASES.includes(name)) {
            clearColourOverrides();
            show(null);
            localStorage.removeItem(STORAGE_KEY);
            return "default";
        }

        if (!STYLE_PRESETS[name]) return null;

        clearColourOverrides();
        show(name);
        localStorage.setItem(STORAGE_KEY, name);
        return name;
    }

    function list() {
        return Object.keys(STYLE_PRESETS).concat("default");
    }

    window.MasterStyle = { apply, list, current };

    // Restore the saved style straight away so the page doesn't flash.
    try {
        show(current());
    } catch (error) {
        console.error("Could not restore style:", error);
    }
})();
</script>

<script>

/* #drawing system */

const drawMenu = document.getElementById("drawMenu");
const drawCanvas = document.getElementById("drawCanvas");
const drawStatus = document.getElementById("drawStatus");
const drawContext = drawCanvas.getContext("2d");

let drawingOpen = false;
let drawingActive = false;
let drawingTool = "pen";
let drawingColour = "black";
let drawingSize = 5;
let drawStart = null;
let drawSnapshot = null;

// Set a white background
function initialiseDrawing() {
    drawContext.fillStyle = "white";
    drawContext.fillRect(
        0, 0, drawCanvas.width, drawCanvas.height
    );
}


// #drawing undo history
let drawingHistory = [];
const MAX_DRAWING_HISTORY = 30;
function saveDrawingState() {
    drawingHistory.push(
        drawContext.getImageData(
            0, 0,
            drawCanvas.width,
            drawCanvas.height
        )
    );
    if (drawingHistory.length > MAX_DRAWING_HISTORY) {
        drawingHistory.shift();
    }
}
function undoDrawing() {
    if (drawingHistory.length === 0) {
        drawStatus.textContent = "Nothing to undo.";
        return;
    }

    const previousState = drawingHistory.pop();

    drawContext.putImageData(previousState, 0, 0);
    updateDrawStatus();
}

initialiseDrawing();

function updateDrawStatus() {
    drawStatus.textContent =
        "Tool: " + drawingTool +
        " | Colour: " + drawingColour +
        " | Size: " + drawingSize;
}

function openDrawMenu() {
    drawingOpen = true;
    drawMenu.style.display = "block";
    updateDrawStatus();
    result.textContent = "Drawing mode opened.";
}

function closeDrawMenu() {
    drawingOpen = false;
    drawingActive = false;
    drawMenu.style.display = "none";
    result.textContent = "Drawing mode closed.";
}

function setDrawingColour(colour, tool) {
    if (!CSS.supports("color", colour)) {
        result.textContent = "Unknown colour: " + colour;
        return;
    }

    drawingColour = colour;
    drawingTool = tool;
    updateDrawStatus();
    result.textContent =
        "Colour set to " + colour + ". Tool: " + tool;
}

function getCanvasPoint(event) {
    const bounds = drawCanvas.getBoundingClientRect();

    return {
        x: (event.clientX - bounds.left) *
            drawCanvas.width / bounds.width,
        y: (event.clientY - bounds.top) *
            drawCanvas.height / bounds.height
    };
}

function drawShape(point) {
    drawContext.beginPath();
    drawContext.strokeStyle = drawingColour;
    drawContext.lineWidth = drawingSize;
    drawContext.lineCap = "round";
    drawContext.lineJoin = "round";

    if (drawingTool === "line") {
        drawContext.moveTo(drawStart.x, drawStart.y);
        drawContext.lineTo(point.x, point.y);
    }

    if (drawingTool === "rectangle") {
        drawContext.rect(
            drawStart.x,
            drawStart.y,
            point.x - drawStart.x,
            point.y - drawStart.y
        );
    }

    if (drawingTool === "circle") {
        const dx = point.x - drawStart.x;
        const dy = point.y - drawStart.y;
        const radius = Math.sqrt(dx * dx + dy * dy);

        drawContext.arc(
            drawStart.x,
            drawStart.y,
            radius,
            0,
            Math.PI * 2
        );
    }

    drawContext.stroke();
}

// Flood fill for enclosed areas
function floodFill(x, y) {
    const width = drawCanvas.width;
    const height = drawCanvas.height;

    const startX = Math.floor(x);
    const startY = Math.floor(y);

    if (
        startX < 0 || startX >= width ||
        startY < 0 || startY >= height
    ) {
        return;
    }

    const image = drawContext.getImageData(
        0, 0, width, height
    );

    const pixels = image.data;
    const startIndex = (startY * width + startX) * 4;

    const target = [
        pixels[startIndex],
        pixels[startIndex + 1],
        pixels[startIndex + 2],
        pixels[startIndex + 3]
    ];

    const colourCanvas = document.createElement("canvas");
    colourCanvas.width = 1;
    colourCanvas.height = 1;

    const colourContext = colourCanvas.getContext("2d");
    colourContext.fillStyle = drawingColour;
    colourContext.fillRect(0, 0, 1, 1);

    const replacement = colourContext.getImageData(0, 0, 1, 1).data;

    if (
        target[0] === replacement[0] &&
        target[1] === replacement[1] &&
        target[2] === replacement[2] &&
        target[3] === 255
    ) {
        return;
    }

    const total = width * height;
    const visited = new Uint8Array(total);
    const stack = new Int32Array(total);
    let stackSize = 0;

    stack[stackSize++] = startY * width + startX;
    visited[startY * width + startX] = 1;

    while (stackSize > 0) {
        const pixel = stack[--stackSize];
        const px = pixel % width;
        const py = Math.floor(pixel / width);
        const index = pixel * 4;

        const matches =
            Math.abs(pixels[index] - target[0]) <= 30 &&
            Math.abs(pixels[index + 1] - target[1]) <= 30 &&
            Math.abs(pixels[index + 2] - target[2]) <= 30 &&
            Math.abs(pixels[index + 3] - target[3]) <= 30;

        if (!matches) continue;

        pixels[index] = replacement[0];
        pixels[index + 1] = replacement[1];
        pixels[index + 2] = replacement[2];
        pixels[index + 3] = 255;

        const neighbours = [
            px > 0 ? pixel - 1 : -1,
            px < width - 1 ? pixel + 1 : -1,
            py > 0 ? pixel - width : -1,
            py < height - 1 ? pixel + width : -1
        ];

        for (const next of neighbours) {
            if (next !== -1 && !visited[next]) {
                visited[next] = 1;
                stack[stackSize++] = next;
            }
        }
    }

    drawContext.putImageData(image, 0, 0);
}

drawCanvas.addEventListener("pointerdown", event => {
    if (!drawingOpen) return;
    saveDrawingState();
    event.preventDefault();

    const point = getCanvasPoint(event);

    if (drawingTool === "fill") {
        floodFill(point.x, point.y);
        return;
    }

    drawingActive = true;
    drawStart = point;

    if (
        drawingTool === "line" ||
        drawingTool === "rectangle" ||
        drawingTool === "circle"
    ) {
        drawSnapshot = drawContext.getImageData(
            0, 0, drawCanvas.width, drawCanvas.height
        );
        return;
    }

    drawContext.beginPath();
    drawContext.moveTo(point.x, point.y);
    drawContext.lineWidth = drawingSize;
    drawContext.lineCap = "round";
    drawContext.lineJoin = "round";
    drawContext.strokeStyle =
        drawingTool === "eraser" ? "white" : drawingColour;

    drawCanvas.setPointerCapture(event.pointerId);
});

drawCanvas.addEventListener("pointermove", event => {
    if (!drawingActive) return;

    event.preventDefault();

    const point = getCanvasPoint(event);

    if (
        drawingTool === "line" ||
        drawingTool === "rectangle" ||
        drawingTool === "circle"
    ) {
        drawContext.putImageData(drawSnapshot, 0, 0);
        drawShape(point);
        return;
    }

    drawContext.lineTo(point.x, point.y);
    drawContext.stroke();
});

function finishDrawing(event) {
    if (!drawingActive) return;

    if (
        drawingTool === "line" ||
        drawingTool === "rectangle" ||
        drawingTool === "circle"
    ) {
        drawContext.putImageData(drawSnapshot, 0, 0);
        drawShape(getCanvasPoint(event));
    }

    drawingActive = false;
    drawStart = null;
    drawSnapshot = null;
    drawContext.beginPath();
}

drawCanvas.addEventListener("pointerup", finishDrawing);
drawCanvas.addEventListener("pointercancel", finishDrawing);

// Commands handled locally without contacting the server
function handleDrawCommand(command) {
    const text = command.trim().toLowerCase();

    if (text === "draw") {
        openDrawMenu();
        return true;
    }

    if (!drawingOpen) return false;

    if (text === "exit draw") {
        closeDrawMenu();
        return true;
    }

    if (text === "save drawing") {
        const link = document.createElement("a");
        link.download = "master-lock-drawing.png";
        link.href = drawCanvas.toDataURL("image/png");
        link.click();

        result.textContent = "Drawing saved as a PNG.";
        return true;
    }

    if (text === "clear drawing") {
        initialiseDrawing();
        result.textContent = "Canvas cleared.";
        return true;
    }

    const colourCommand = text.match(/^color\s+(.+)$/);

    if (colourCommand) {
        setDrawingColour(colourCommand[1], "pen");
        return true;
    }

    const fillCommand = text.match(/^fill\s+(.+)$/);

    if (fillCommand) {
        setDrawingColour(fillCommand[1], "fill");
        return true;
    }

    const toolCommand = text.match(/^tool\s+(pen|eraser|line|rectangle|circle|fill)$/);

    if (toolCommand) {
        drawingTool = toolCommand[1];
        updateDrawStatus();
        result.textContent = "Tool changed to " + drawingTool + ".";
        return true;
    }

    const sizeCommand = text.match(/^size\s+(\d+)$/);
if (command.toLowerCase() === "undo") {
    undoDrawing();
    return true;
}

    if (sizeCommand) {
        const size = Number(sizeCommand[1]);

        if (size < 1 || size > 50) {
            result.textContent = "Brush size must be between 1 and 50.";
        } else {
            drawingSize = size;
            updateDrawStatus();
            result.textContent = "Brush size set to " + size + ".";
        }

        return true;
    }

    result.textContent =
        "Unknown drawing command. Try color red, fill blue, " +
        "tool eraser, tool line, tool rectangle, tool circle, " +
        "size 5, clear drawing, save drawing or exit draw.";

    return true;
}

/* #AI markdown renderer */

function renderMarkdown(container, markdown) {
    container.replaceChildren();

    const lines = String(markdown).replace(/\r/g, "").split("\n");
    let i = 0;

    // Format inline text safely
    function addInline(parent, text) {
        const pattern = /(\*\*.+?\*\*|(?<!\*)\*[^*\n]+?\*|`[^`\n]+?`)/g;
        let last = 0;
        let match;

        while ((match = pattern.exec(text)) !== null) {
            parent.appendChild(
                document.createTextNode(text.slice(last, match.index))
            );

            const token = match[0];
            let element;
            let content;

            if (token.startsWith("**")) {
                element = document.createElement("strong");
                content = token.slice(2, -2);
            } else if (token.startsWith("*")) {
                element = document.createElement("em");
                content = token.slice(1, -1);
            } else {
                element = document.createElement("code");
                content = token.slice(1, -1);
            }

            element.textContent = content;
            parent.appendChild(element);
            last = pattern.lastIndex;
        }

        parent.appendChild(
            document.createTextNode(text.slice(last))
        );
    }

    function isBlockStart(line) {
        return (
            /^#{1,6}\s+/.test(line) ||
            /^\s*[-*]\s+/.test(line) ||
            /^\s*\d+\.\s+/.test(line) ||
            /^\s*---+\s*$/.test(line)
        );
    }

    while (i < lines.length) {
        const line = lines[i];

        if (!line.trim()) {
            i++;
            continue;
        }

        // Headings
        const heading = line.match(/^(#{1,6})\s+(.+)$/);

        if (heading) {
            const level = Math.min(heading[1].length, 6);
            const element = document.createElement("h" + level);

            addInline(element, heading[2]);
            container.appendChild(element);
            i++;
            continue;
        }

        // Horizontal divider
        if (/^\s*---+\s*$/.test(line)) {
            container.appendChild(document.createElement("hr"));
            i++;
            continue;
        }

        // Bullet lists
        if (/^\s*[-*]\s+/.test(line)) {
            const list = document.createElement("ul");

            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
                const item = document.createElement("li");
                addInline(item, lines[i].replace(/^\s*[-*]\s+/, ""));
                list.appendChild(item);
                i++;
            }

            container.appendChild(list);
            continue;
        }
        // Numbered lists
        if (/^\s*\d+\.\s+/.test(line)) {
            const list = document.createElement("ol");
            while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
                const item = document.createElement("li");
                addInline(item, lines[i].replace(/^\s*\d+\.\s+/, ""));
                list.appendChild(item);
                i++;
            }
            container.appendChild(list);
            continue;
        }
        // Normal paragraphs
        const paragraph = document.createElement("p");
        addInline(paragraph, lines[i]);
        i++;
        while (
            i < lines.length &&
            lines[i].trim() &&
            !isBlockStart(lines[i])
        ) {
            paragraph.appendChild(document.createTextNode(" "));
            addInline(paragraph, lines[i]);
            i++;
        }
        container.appendChild(paragraph);
    }
}

/* #photo database */

let photoDatabase = null;

function openPhotoDatabase() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("MasterLockPhotos", 1);

        request.onupgradeneeded = event => {
            const db = event.target.result;

            if (!db.objectStoreNames.contains("photos")) {
                db.createObjectStore("photos", {
                    keyPath: "id",
                    autoIncrement: true
                });
            }
        };

        request.onsuccess = () => {
            photoDatabase = request.result;
            resolve(photoDatabase);
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

async function savePhoto(blob) {
    const db = photoDatabase || await openPhotoDatabase();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction("photos", "readwrite");
        const store = transaction.objectStore("photos");

        store.add({
            blob: blob,
            created: new Date().toISOString()
        });

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
    });
}

async function getSavedPhotos() {
    const db = photoDatabase || await openPhotoDatabase();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction("photos", "readonly");
        const request = transaction.objectStore("photos").getAll();

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

async function deleteSavedPhoto(id) {
    const db = photoDatabase || await openPhotoDatabase();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction("photos", "readwrite");

        transaction.objectStore("photos").delete(id);

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
    });
}

/* #QR and barcode scanner */

async function startCodeScanner(mode) {
    await stopCamera();

    cameraMode = mode;
    openCameraMenu(mode === "qr" ? "QR SCANNER" : "BARCODE SCANNER");

    cameraReader.style.display = "block";

    if (typeof Html5Qrcode === "undefined") {
        cameraStatus.textContent =
            "Scanner library failed to load. Check your internet connection.";
        return;
    }

    cameraStarting = true;

    try {
        const formats = mode === "qr"
            ? [Html5QrcodeSupportedFormats.QR_CODE]
            : [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.ITF,
                Html5QrcodeSupportedFormats.CODABAR
            ];

        cameraScanner = new Html5Qrcode("camera-reader", {
            formatsToSupport: formats
        });

        await cameraScanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 250, height: 180 },
                aspectRatio: 1
            },
            async decodedText => {
                if (!cameraScanner || cameraMode !== mode) return;

                await stopCamera();

                cameraMenu.style.display = "none";
                result.textContent = decodedText;
            },
            () => {
                // No code detected in this frame.
            }
        );

        cameraRunning = true;
        cameraStatus.textContent = mode === "qr"
            ? "Point at a QR code."
            : "Point at a barcode.";
    } catch (error) {
        console.error("Scanner error:", error);

        cameraStatus.textContent =
            "Could not start scanner. Check camera permissions.";

        await stopCamera();
    } finally {
        cameraStarting = false;
    }
}

/* #photos gallery */

async function showPhotos() {
    await stopCamera();

    cameraMode = "photos";
    openCameraMenu("PHOTOS");
    cameraStatus.textContent = "Loading saved photos...";
    photoGallery.style.display = "grid";

    try {
        const photos = await getSavedPhotos();

        if (!photos.length) {
            photoGallery.style.display = "block";
            cameraStatus.textContent = "No saved photos yet.";
            return;
        }

        cameraStatus.textContent =
            photos.length + (photos.length === 1
                ? " saved photo."
                : " saved photos.");

        photos.sort((a, b) => b.id - a.id);

        for (const photo of photos) {
            const card = document.createElement("div");
            card.className = "photo-card";

            const image = document.createElement("img");
            const imageURL = URL.createObjectURL(photo.blob);

            image.src = imageURL;
            image.alt = "Saved photo";

            const downloadButton = document.createElement("button");
            downloadButton.type = "button";
            downloadButton.textContent = "Download";

            downloadButton.addEventListener("click", () => {
                const link = document.createElement("a");
                link.href = imageURL;
                link.download = "master-lock-photo-" + photo.id + ".jpg";
                link.click();
            });

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", async () => {
                try {
                    await deleteSavedPhoto(photo.id);
                    URL.revokeObjectURL(imageURL);
                    await showPhotos();
                } catch (error) {
                    cameraStatus.textContent = "Could not delete photo.";

/* #stop camera */

async function stopCamera() {
    if (cameraScanner) {
        const scanner = cameraScanner;
        cameraScanner = null;

        try {
            if (cameraRunning) {
                await scanner.stop();
            }
        } catch (error) {
            console.warn("Scanner stop:", error);
        }

        try {
            await scanner.clear();
        } catch (error) {
            console.warn("Scanner cleanup:", error);
        }
    }

    cameraRunning = false;

    if (photoStream) {
        photoStream.getTracks().forEach(track => track.stop());
        photoStream = null;
    }

    photoVideo.srcObject = null;
}

if (answer.type === "result") {
    const text = answer.text;
    maxSpeak(text);
    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&*";
    result.textContent = "";
    let position = 0;
    const interval = setInterval(() => {
        let display = "";
        for (let i = 0; i < text.length; i++) {
            if (i < position) {
                display += text[i];
            } else if (text[i] === "\n" || text[i] === " ") {
                display += text[i];
            } else {
                display += characters[
                    Math.floor(Math.random() * characters.length)
                ];
            }
        }
        result.textContent = display;
        position += 2;
        if (position >= text.length) {
            clearInterval(interval);
            result.textContent = text;
        }
    }, 15);
}

if (answer.type === "code") {

    result.textContent = answer.text;
    maxSpeak(answer.text);
    answer.unlocks.forEach(code => {

        if (!unlockedCodes.includes(code)) {
            unlockedCodes.push(code);
        }

    });

    localStorage.setItem(
        "masterUnlocked",
        JSON.stringify(unlockedCodes)
    );

    return;
}

if (answer.type === "decrypt") {

    const text = answer.text;
    maxSpeak(text);
    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";

    let position = 0;

    result.textContent = "";

    const interval = setInterval(() => {

        let display = "";

        for (let i = 0; i < text.length; i++) {

            if (i < position) {
                display += text[i];
            } else if (text[i] === " ") {
                display += " ";
            } else {
                display += characters[
                    Math.floor(Math.random() * characters.length)
                ];
            }
        }

        result.textContent = display;

        position++;

        if (position > text.length) {
            clearInterval(interval);
            result.textContent = text;
        }

    }, 50);
}

});


unlockButton.addEventListener("click", async () => {

        return;
    }

    const data = new FormData();

    data.append("code", code);
    data.append("locked", "true");

        method: "POST",

    });

    if (answer.type === "reset") {
        lockResult.textContent = "RESET";

        location.reload();

        return;
    }

        return;
    }

    lockResult.textContent = "INCORRECT CODE";

/* #microphone */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let listening = false;

if (SpeechRecognition) {

    mic.addEventListener("click", function() {

        console.log("MIC BUTTON CLICKED");

        if (listening) {

            console.log("STOPPING");

            if (recognition) {
                recognition.stop();
            }

            return;
        }

        console.log("CREATING RECOGNITION");

        recognition = new SpeechRecognition();

        recognition.lang = "en-GB";
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = function() {

            listening = true;

            mic.textContent = "Listening...";

            console.log("MICROPHONE STARTED");

        };

       


recognition.onresult = event => {
    let finalTranscript = "";
    let interimTranscript = "";

    for (let i = 0; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;

        if (event.results[i].isFinal) {
            finalTranscript += transcript;
        } else {
            interimTranscript += transcript;
        }
    }

    input.value = finalTranscript + interimTranscript;

    // #voice command execution
    // #voice command execution

if (finalTranscript.trim()) {
    const spokenText = finalTranscript.trim();

    // #Max direct commands
    const maxCommandMatch = spokenText.match(
        /^\s*max[\s,:-]+(.+?)\s*[.!?]*\s*$/i
    );

    if (maxCommandMatch) {
        const maxCommand = maxCommandMatch[1]
            .trim()
            .toLowerCase()
            .replace(/[.!?]+$/, "")
            .trim();

        // #mute
        if (maxCommand === "mute") {
            maxMuted = true;
            window.speechSynthesis.cancel();
            result.textContent = "Max is muted.";
            recognition.stop();
            return;
        }

        // #unmute
        if (maxCommand === "unmute") {
            maxMuted = false;
            result.textContent = "Max is unmuted.";
            recognition.stop();
            maxSpeak("I am back.");
            return;
        }

        // #repeat
        if (maxCommand === "repeat") {
            const previousResponse = maxLastSpoken;
            recognition.stop();

            if (previousResponse && !maxMuted) {
                maxSpeak(previousResponse);
            }

            return;
        }

        // #stop speaking
        if (
            maxCommand === "stop speaking" ||
            maxCommand === "stop talking"
        ) {
            window.speechSynthesis.cancel();
            recognition.stop();
            return;
        }

        // #navigation
        
        const navigationMatch = spokenText.match(
            /^\s*(?:max[\s,:-]+)?(?:go to|open|show me|take me to|navigate to|launch)\s+(.+?)\s*[.!?]*\s*$/i
        );

        if (navigationMatch) {
            const command = navigationMatch[1].trim();

            if (command) {
                input.value = command;
                recognition.stop();
                form.requestSubmit();
                return;
            }
        }

        // #other Max commands
        // Pass any other "Max, ..." command to Master Lock.
        const command = maxCommandMatch[1].trim();

        if (command) {
            input.value = command;
            recognition.stop();
            form.requestSubmit();
            return;
        }
    }


    // #navigation without wake word
    const navigationMatch = spokenText.match(
        /^\s*(?:go to|open|show me|take me to|navigate to|launch)\s+(.+?)\s*[.!?]*\s*$/i
    );

    if (navigationMatch) {
        const command = navigationMatch[1].trim();

        if (command) {
            input.value = command;
            recognition.stop();
            form.requestSubmit();
        }
    }
}
};


        recognition.onerror = function(event) {

            console.error(
                "MICROPHONE ERROR:",
                event.error
            );

            listening = false;

            mic.textContent = "Listen";

        };

        recognition.onend = function() {

            console.log("MICROPHONE ENDED");

            listening = false;

            mic.textContent = "Listen";

            recognition = null;

        };

        try {

            recognition.start();

            console.log("STARTING");

        } catch (error) {

            console.error(
                "START ERROR:",
                error
            );

            listening = false;

            mic.textContent = "Listen";

            recognition = null;

        }

    });

} else {

    mic.disabled = true;

    mic.textContent = "No mic";

    console.error(
        "SpeechRecognition is not supported."
    );

}

// #keyboard shortcuts

input.addEventListener("keydown", event => {

    if (event.key === "ArrowUp") {

        event.preventDefault();

        if (commandHistory.length === 0) {
            return;
        }

        historyIndex = Math.max(0, historyIndex - 1);

        input.value = commandHistory[historyIndex];

    }

    else if (event.key === "ArrowDown") {

        event.preventDefault();

        if (commandHistory.length === 0) {
            return;
        }

        historyIndex = Math.min(
            commandHistory.length,
            historyIndex + 1
        );

        input.value = historyIndex === commandHistory.length
            ? ""
            : commandHistory[historyIndex];

    }

    else if (event.key === "Escape") {

        input.value = "";
        historyIndex = commandHistory.length;

    }

});

/* #game engine */

const gameMenu = document.getElementById("gameMenu");
const gameTitle = document.getElementById("gameTitle");
const gameStatus = document.getElementById("gameStatus");
const gameCanvas = document.getElementById("gameCanvas");
const gameCtx = gameCanvas.getContext("2d");
const gameControls = document.getElementById("gameControls");

let activeGame = null;
let gameTimer = null;
let gameState = null;
let gamePlayers = 1;
let gameOver = false;

function startGame(answer) {
    if (answer.game !== "tic-tac-toe") {
        result.textContent = "That game is no longer available.";
        return;
    }

    clearInterval(gameTimer);
    gameTimer = null;
    activeGame = answer.game;
    gamePlayers = answer.players ?? 1;
    gameOver = false;

    gameMenu.style.display = "block";
    gameTitle.textContent = "Tic-Tac-Toe";

    gameControls.replaceChildren();
    gameCanvas.style.display = "block";

    setupTicTacToe();

    gameMenu.scrollIntoView({ behavior: "smooth", block: "start" });
}

function addGameButton(label, callback) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.addEventListener("click", callback);
    gameControls.appendChild(button);
    return button;
}

function stopGame() {
    clearInterval(gameTimer);
    gameTimer = null;
    activeGame = null;
    gameState = null;
    gameMenu.style.display = "none";
    gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
}

document.getElementById("closeGame").addEventListener("click", stopGame);

document.getElementById("restartGame").addEventListener("click", () => {
    if (activeGame) {
        startGame({
            game: activeGame,
            players: gamePlayers
        });
    }
});

/* #tic tac toe */

function setupTicTacToe() {
    gameCanvas.width = 450;
    gameCanvas.height = 450;
    gameState = Array(9).fill("");
    gameOver = false;
    let turn = "X";

    function winner(board) {
        const lines = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];

        for (const line of lines) {
            const [a,b,c] = line;
            if (board[a] && board[a] === board[b] && board[b] === board[c]) {
                return board[a];
            }
        }

        return board.every(Boolean) ? "Draw" : null;
    }

    function draw() {
        gameCtx.clearRect(0, 0, 450, 450);
        gameCtx.strokeStyle = "#ffffff";
        gameCtx.lineWidth = 5;

        for (let i = 1; i < 3; i++) {
            gameCtx.beginPath();
            gameCtx.moveTo(i * 150, 15);
            gameCtx.lineTo(i * 150, 435);
            gameCtx.moveTo(15, i * 150);
            gameCtx.lineTo(435, i * 150);
            gameCtx.stroke();
        }

        gameState.forEach((mark, i) => {
            if (!mark) return;

            gameCtx.fillStyle = mark === "X" ? "#66ccff" : "#ffcc66";
            gameCtx.font = "bold 100px Arial";
            gameCtx.textAlign = "center";
            gameCtx.textBaseline = "middle";
            gameCtx.fillText(mark, (i % 3) * 150 + 75, Math.floor(i / 3) * 150 + 75);
        });
    }

    function finishIfNeeded() {
        const result = winner(gameState);
        if (!result) return false;

        gameOver = true;
        gameStatus.textContent = result === "Draw" ? "It's a draw!" : result + " wins!";
        return true;
    }

    function computerMove() {
        if (gameOver) return;

        const available = gameState
            .map((value, index) => value ? -1 : index)
            .filter(index => index !== -1);

        if (!available.length) return;

        // Prefer a winning move, then block the opponent, otherwise choose randomly.
        let chosen = null;

        for (const mark of ["O", "X"]) {
            for (const index of available) {
                const test = [...gameState];
                test[index] = mark;
                if (winner(test) === mark) {
                    chosen = index;
                    break;
                }
            }
            if (chosen !== null) break;
        }

        if (chosen === null) {
            chosen = available[Math.floor(Math.random() * available.length)];
        }

        gameState[chosen] = turn;
        turn = turn === "X" ? "O" : "X";
        draw();

        if (!finishIfNeeded()) {
            gameStatus.textContent = "Turn: " + turn;
            if (gamePlayers === 0) {
                setTimeout(computerMove, 350);
            }
        }
    }

    function playCell(index) {
        if (gameOver || gameState[index]) return;
        if (gamePlayers === 0) return;
        if (gamePlayers === 1 && turn === "O") return;

        gameState[index] = turn;
        turn = turn === "X" ? "O" : "X";
        draw();

        if (finishIfNeeded()) return;

        gameStatus.textContent = "Turn: " + turn;

        if (gamePlayers === 1 && turn === "O") {
            setTimeout(computerMove, 350);
        }
    }

    gameCanvas.onclick = event => {
        const rect = gameCanvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * 450 / rect.width;
        const y = (event.clientY - rect.top) * 450 / rect.height;
        playCell(Math.floor(y / 150) * 3 + Math.floor(x / 150));
    };

    gameStatus.textContent = gamePlayers === 0
        ? "Computer vs computer"
        : gamePlayers === 1
            ? "You are X. The computer is O."
            : "Two players: X goes first.";

    draw();

    if (gamePlayers === 0) {
        setTimeout(computerMove, 350);
    }
}
