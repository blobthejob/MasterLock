<!DOCTYPE html>
<html>
<head>
    <title>Master Lock</title>

    <style>
        body {
            background: black;
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        input {
            width: 600px;
            max-width: 70vw;
            padding: 15px;
            background: #111;
            color: white;
            border: 2px solid #333;
            outline: none;
            font-size: 28px;
        }

        input:focus {
            border-color: #777;
        }

        button {
            padding: 15px 20px;
            margin-left: 8px;
            background: #222;
            color: white;
            border: 2px solid #333;
            cursor: pointer;
            font-size: 22px;
        }

        button:hover {
            background: #333;
        }

        .result {
            margin-top: 30px;
            font-size: 24px;
        }

        #lockedScreen {
            display: none;
            text-align: center;
        }

        #lockedScreen input {
            display: block;
            margin: 25px auto;
        }

        #lockedScreen button {
            margin-left: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <div id="normalScreen">

        <form id="commandForm">

            <input
                id="code"
                name="code"
                placeholder="Enter command..."
                autofocus
                autocomplete="off"
            >

            <button type="submit">Go</button>

            <button type="button" id="mic">Listen</button>

        </form>

        <div id="result" class="result"></div>

    </div>


    <div id="lockedScreen">

        <h1>MASTER LOCK</h1>

        <h2>LOCKED</h2>

        <input
            id="unlockCode"
            placeholder="Enter unlock code..."
            autocomplete="off"
        >

        <button id="unlockButton">UNLOCK</button>

        <div id="lockResult" class="result"></div>

    </div>

</div>


<script>

const form = document.getElementById("commandForm");
const input = document.getElementById("code");
const result = document.getElementById("result");
const mic = document.getElementById("mic");

const normalScreen = document.getElementById("normalScreen");
const lockedScreen = document.getElementById("lockedScreen");

const unlockCode = document.getElementById("unlockCode");
const unlockButton = document.getElementById("unlockButton");
const lockResult = document.getElementById("lockResult");


function showLocked() {

    localStorage.setItem("masterLockLocked", "true");

    normalScreen.style.display = "none";
    lockedScreen.style.display = "block";

    unlockCode.focus();
}


function showNormal() {

    localStorage.removeItem("masterLockLocked");

    lockedScreen.style.display = "none";
    normalScreen.style.display = "block";

    input.value = "";
    input.focus();
}


if (localStorage.getItem("masterLockLocked") === "true") {
    showLocked();
}


form.addEventListener("submit", async event => {

    event.preventDefault();

    const data = new FormData(form);

    const response = await fetch("/", {
        method: "POST",
        body: data
    });

    const answer = await response.json();

    input.value = "";

    if (answer.type === "lock") {
        showLocked();
        return;
    }

    if (answer.type === "url") {
        window.location.href = answer.url;
        return;
    }

    if (answer.type === "result") {
        result.textContent = answer.text;
    }

});


unlockButton.addEventListener("click", async () => {

    const code = unlockCode.value.trim();

    if (!code) {
        return;
    }

    const data = new FormData();

    data.append("code", code);

    const response = await fetch("/", {
        method: "POST",
        body: data
    });

    const answer = await response.json();

    if (answer.type === "unlock") {
        lockResult.textContent = "UNLOCKED";

        setTimeout(() => {
            showNormal();
        }, 500);

    } else {
        lockResult.textContent = "INCORRECT CODE";
        unlockCode.value = "";
        unlockCode.focus();
    }

});


unlockCode.addEventListener("keydown", event => {

    if (event.key === "Enter") {
        unlockButton.click();
    }

});


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let listening = false;
let recognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "en-GB";
    recognition.continuous = true;
    recognition.interimResults = false;

    mic.addEventListener("click", () => {

        if (listening) {
            recognition.stop();
            return;
        }

        recognition.start();

    });

    recognition.addEventListener("start", () => {
        listening = true;
        mic.textContent = "Listening...";
    });

    recognition.addEventListener("result", event => {

        const text =
            event.results[event.results.length - 1][0].transcript;

        input.value = text;

    });

    recognition.addEventListener("end", () => {

        listening = false;
        mic.textContent = "Listen";

    });

} else {

    mic.disabled = true;
    mic.textContent = "No mic";

}

</script>

</body>
</html>
