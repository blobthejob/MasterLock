<script>

/* #drawing system */

const drawMenu = document.getElementById("drawMenu");
const drawCanvas = document.getElementById("drawCanvas");
const drawStatus = document.getElementById("drawStatus");
const drawContext = drawCanvas.getContext("2d");

let drawingOpen = false;
let drawingActive = false;
let drawingTool = "pen";
let drawingColour = "black";
let drawingSize = 5;
let drawStart = null;
let drawSnapshot = null;

// Set a white background
function initialiseDrawing() {
    drawContext.fillStyle = "white";
    drawContext.fillRect(
        0, 0, drawCanvas.width, drawCanvas.height
    );
}


// #drawing undo history
let drawingHistory = [];
const MAX_DRAWING_HISTORY = 30;
function saveDrawingState() {
    drawingHistory.push(
        drawContext.getImageData(
            0, 0,
            drawCanvas.width,
            drawCanvas.height
        )
    );
    if (drawingHistory.length > MAX_DRAWING_HISTORY) {
        drawingHistory.shift();
    }
}
function undoDrawing() {
    if (drawingHistory.length === 0) {
        drawStatus.textContent = "Nothing to undo.";
        return;
    }

    const previousState = drawingHistory.pop();

    drawContext.putImageData(previousState, 0, 0);
    updateDrawStatus();
}

initialiseDrawing();

function updateDrawStatus() {
    drawStatus.textContent =
        "Tool: " + drawingTool +
        " | Colour: " + drawingColour +
        " | Size: " + drawingSize;
}

function openDrawMenu() {
    drawingOpen = true;
    drawMenu.style.display = "block";
    updateDrawStatus();
    result.textContent = "Drawing mode opened.";
}

function closeDrawMenu() {
    drawingOpen = false;
    drawingActive = false;
    drawMenu.style.display = "none";
    result.textContent = "Drawing mode closed.";
}

function setDrawingColour(colour, tool) {
    if (!CSS.supports("color", colour)) {
        result.textContent = "Unknown colour: " + colour;
        return;
    }

    drawingColour = colour;
    drawingTool = tool;
    updateDrawStatus();
    result.textContent =
        "Colour set to " + colour + ". Tool: " + tool;
}

function getCanvasPoint(event) {
    const bounds = drawCanvas.getBoundingClientRect();

    return {
        x: (event.clientX - bounds.left) *
            drawCanvas.width / bounds.width,
        y: (event.clientY - bounds.top) *
            drawCanvas.height / bounds.height
    };
}

function drawShape(point) {
    drawContext.beginPath();
    drawContext.strokeStyle = drawingColour;
    drawContext.lineWidth = drawingSize;
    drawContext.lineCap = "round";
    drawContext.lineJoin = "round";

    if (drawingTool === "line") {
        drawContext.moveTo(drawStart.x, drawStart.y);
        drawContext.lineTo(point.x, point.y);
    }

    if (drawingTool === "rectangle") {
        drawContext.rect(
            drawStart.x,
            drawStart.y,
            point.x - drawStart.x,
            point.y - drawStart.y
        );
    }

    if (drawingTool === "circle") {
        const dx = point.x - drawStart.x;
        const dy = point.y - drawStart.y;
        const radius = Math.sqrt(dx * dx + dy * dy);

        drawContext.arc(
            drawStart.x,
            drawStart.y,
            radius,
            0,
            Math.PI * 2
        );
    }

    drawContext.stroke();
}

// Flood fill for enclosed areas
function floodFill(x, y) {
    const width = drawCanvas.width;
    const height = drawCanvas.height;

    const startX = Math.floor(x);
    const startY = Math.floor(y);

    if (
        startX < 0 || startX >= width ||
        startY < 0 || startY >= height
    ) {
        return;
    }

    const image = drawContext.getImageData(
        0, 0, width, height
    );

    const pixels = image.data;
    const startIndex = (startY * width + startX) * 4;

    const target = [
        pixels[startIndex],
        pixels[startIndex + 1],
        pixels[startIndex + 2],
        pixels[startIndex + 3]
    ];

    const colourCanvas = document.createElement("canvas");
    colourCanvas.width = 1;
    colourCanvas.height = 1;

    const colourContext = colourCanvas.getContext("2d");
    colourContext.fillStyle = drawingColour;
    colourContext.fillRect(0, 0, 1, 1);

    const replacement = colourContext.getImageData(0, 0, 1, 1).data;

    if (
        target[0] === replacement[0] &&
        target[1] === replacement[1] &&
        target[2] === replacement[2] &&
        target[3] === 255
    ) {
        return;
    }

    const total = width * height;
    const visited = new Uint8Array(total);
    const stack = new Int32Array(total);
    let stackSize = 0;

    stack[stackSize++] = startY * width + startX;
    visited[startY * width + startX] = 1;

    while (stackSize > 0) {
        const pixel = stack[--stackSize];
        const px = pixel % width;
        const py = Math.floor(pixel / width);
        const index = pixel * 4;

        const matches =
            Math.abs(pixels[index] - target[0]) <= 30 &&
            Math.abs(pixels[index + 1] - target[1]) <= 30 &&
            Math.abs(pixels[index + 2] - target[2]) <= 30 &&
            Math.abs(pixels[index + 3] - target[3]) <= 30;

        if (!matches) continue;

        pixels[index] = replacement[0];
        pixels[index + 1] = replacement[1];
        pixels[index + 2] = replacement[2];
        pixels[index + 3] = 255;

        const neighbours = [
            px > 0 ? pixel - 1 : -1,
            px < width - 1 ? pixel + 1 : -1,
            py > 0 ? pixel - width : -1,
            py < height - 1 ? pixel + width : -1
        ];

        for (const next of neighbours) {
            if (next !== -1 && !visited[next]) {
                visited[next] = 1;
                stack[stackSize++] = next;
            }
        }
    }

    drawContext.putImageData(image, 0, 0);
}

drawCanvas.addEventListener("pointerdown", event => {
    if (!drawingOpen) return;
    saveDrawingState();
    event.preventDefault();

    const point = getCanvasPoint(event);

    if (drawingTool === "fill") {
        floodFill(point.x, point.y);
        return;
    }

    drawingActive = true;
    drawStart = point;

    if (
        drawingTool === "line" ||
        drawingTool === "rectangle" ||
        drawingTool === "circle"
    ) {
        drawSnapshot = drawContext.getImageData(
            0, 0, drawCanvas.width, drawCanvas.height
        );
        return;
    }

    drawContext.beginPath();
    drawContext.moveTo(point.x, point.y);
    drawContext.lineWidth = drawingSize;
    drawContext.lineCap = "round";
    drawContext.lineJoin = "round";
    drawContext.strokeStyle =
        drawingTool === "eraser" ? "white" : drawingColour;

    drawCanvas.setPointerCapture(event.pointerId);
});

drawCanvas.addEventListener("pointermove", event => {
    if (!drawingActive) return;

    event.preventDefault();

    const point = getCanvasPoint(event);

    if (
        drawingTool === "line" ||
        drawingTool === "rectangle" ||
        drawingTool === "circle"
    ) {
        drawContext.putImageData(drawSnapshot, 0, 0);
        drawShape(point);
        return;
    }

    drawContext.lineTo(point.x, point.y);
    drawContext.stroke();
});

function finishDrawing(event) {
    if (!drawingActive) return;

    if (
        drawingTool === "line" ||
        drawingTool === "rectangle" ||
        drawingTool === "circle"
    ) {
        drawContext.putImageData(drawSnapshot, 0, 0);
        drawShape(getCanvasPoint(event));
    }

    drawingActive = false;
    drawStart = null;
    drawSnapshot = null;
    drawContext.beginPath();
}

drawCanvas.addEventListener("pointerup", finishDrawing);
drawCanvas.addEventListener("pointercancel", finishDrawing);

// Commands handled locally without contacting the server
function handleDrawCommand(command) {
    const text = command.trim().toLowerCase();

    if (text === "draw") {
        openDrawMenu();
        return true;
    }

    if (!drawingOpen) return false;

    if (text === "exit draw") {
        closeDrawMenu();
        return true;
    }

    if (text === "save drawing") {
        const link = document.createElement("a");
        link.download = "master-lock-drawing.png";
        link.href = drawCanvas.toDataURL("image/png");
        link.click();

        result.textContent = "Drawing saved as a PNG.";
        return true;
    }

    if (text === "clear drawing") {
        initialiseDrawing();
        result.textContent = "Canvas cleared.";
        return true;
    }

    const colourCommand = text.match(/^color\s+(.+)$/);

    if (colourCommand) {
        setDrawingColour(colourCommand[1], "pen");
        return true;
    }

    const fillCommand = text.match(/^fill\s+(.+)$/);

    if (fillCommand) {
        setDrawingColour(fillCommand[1], "fill");
        return true;
    }

    const toolCommand = text.match(/^tool\s+(pen|eraser|line|rectangle|circle|fill)$/);

    if (toolCommand) {
        drawingTool = toolCommand[1];
        updateDrawStatus();
        result.textContent = "Tool changed to " + drawingTool + ".";
        return true;
    }

    const sizeCommand = text.match(/^size\s+(\d+)$/);
if (command.toLowerCase() === "undo") {
    undoDrawing();
    return true;
}

    if (sizeCommand) {
        const size = Number(sizeCommand[1]);

        if (size < 1 || size > 50) {
            result.textContent = "Brush size must be between 1 and 50.";
        } else {
            drawingSize = size;
            updateDrawStatus();
            result.textContent = "Brush size set to " + size + ".";
        }

        return true;
    }

    result.textContent =
        "Unknown drawing command. Try color red, fill blue, " +
        "tool eraser, tool line, tool rectangle, tool circle, " +
        "size 5, clear drawing, save drawing or exit draw.";

    return true;
}

/* #AI markdown renderer */

function renderMarkdown(container, markdown) {
    container.replaceChildren();

    const lines = String(markdown).replace(/\r/g, "").split("\n");
    let i = 0;

    // Format inline text safely
    function addInline(parent, text) {
        const pattern = /(\*\*.+?\*\*|(?<!\*)\*[^*\n]+?\*|`[^`\n]+?`)/g;
        let last = 0;
        let match;

        while ((match = pattern.exec(text)) !== null) {
            parent.appendChild(
                document.createTextNode(text.slice(last, match.index))
            );

            const token = match[0];
            let element;
            let content;

            if (token.startsWith("**")) {
                element = document.createElement("strong");
                content = token.slice(2, -2);
            } else if (token.startsWith("*")) {
                element = document.createElement("em");
                content = token.slice(1, -1);
            } else {
                element = document.createElement("code");
                content = token.slice(1, -1);
            }

            element.textContent = content;
            parent.appendChild(element);
            last = pattern.lastIndex;
        }

        parent.appendChild(
            document.createTextNode(text.slice(last))
        );
    }

    function isBlockStart(line) {
        return (
            /^#{1,6}\s+/.test(line) ||
            /^\s*[-*]\s+/.test(line) ||
            /^\s*\d+\.\s+/.test(line) ||
            /^\s*---+\s*$/.test(line)
        );
    }

    while (i < lines.length) {
        const line = lines[i];

        if (!line.trim()) {
            i++;
            continue;
        }

        // Headings
        const heading = line.match(/^(#{1,6})\s+(.+)$/);

        if (heading) {
            const level = Math.min(heading[1].length, 6);
            const element = document.createElement("h" + level);

            addInline(element, heading[2]);
            container.appendChild(element);
            i++;
            continue;
        }

        // Horizontal divider
        if (/^\s*---+\s*$/.test(line)) {
            container.appendChild(document.createElement("hr"));
            i++;
            continue;
        }

        // Bullet lists
        if (/^\s*[-*]\s+/.test(line)) {
            const list = document.createElement("ul");

            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
                const item = document.createElement("li");
                addInline(item, lines[i].replace(/^\s*[-*]\s+/, ""));
                list.appendChild(item);
                i++;
            }

            container.appendChild(list);
            continue;
        }
        // Numbered lists
        if (/^\s*\d+\.\s+/.test(line)) {
            const list = document.createElement("ol");
            while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
                const item = document.createElement("li");
                addInline(item, lines[i].replace(/^\s*\d+\.\s+/, ""));
                list.appendChild(item);
                i++;
            }
            container.appendChild(list);
            continue;
        }
        // Normal paragraphs
        const paragraph = document.createElement("p");
        addInline(paragraph, lines[i]);
        i++;
        while (
            i < lines.length &&
            lines[i].trim() &&
            !isBlockStart(lines[i])
        ) {
            paragraph.appendChild(document.createTextNode(" "));
            addInline(paragraph, lines[i]);
            i++;
        }
        container.appendChild(paragraph);
    }
}

/* #camera and photos app */

const cameraMenu = document.getElementById("cameraMenu");
const cameraTitle = document.getElementById("cameraTitle");
const cameraStatus = document.getElementById("cameraStatus");
const cameraReader = document.getElementById("camera-reader");

const photoCamera = document.getElementById("photoCamera");

const photoGallery = document.getElementById("photoGallery");

const takePhotoButton = document.getElementById("takePhoto");

let cameraStarting = false;

let photoStream = null;
let cameraFacing = "environment";
let cameraMode = "";

/* #photo database */

let photoDatabase = null;

function openPhotoDatabase() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("MasterLockPhotos", 1);

        request.onupgradeneeded = event => {
            const db = event.target.result;

            if (!db.objectStoreNames.contains("photos")) {
                db.createObjectStore("photos", {
                    keyPath: "id",
                    autoIncrement: true
                });
            }
        };

        request.onsuccess = () => {
            photoDatabase = request.result;
            resolve(photoDatabase);
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

async function savePhoto(blob) {
    const db = photoDatabase || await openPhotoDatabase();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction("photos", "readwrite");
        const store = transaction.objectStore("photos");

        store.add({
            blob: blob,
            created: new Date().toISOString()
        });

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
    });
}

async function getSavedPhotos() {
    const db = photoDatabase || await openPhotoDatabase();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction("photos", "readonly");
        const request = transaction.objectStore("photos").getAll();

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

async function deleteSavedPhoto(id) {
    const db = photoDatabase || await openPhotoDatabase();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction("photos", "readwrite");

        transaction.objectStore("photos").delete(id);

        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
    });
}

/* #camera menu */

function openCameraMenu(title) {
    cameraMenu.style.display = "block";
    cameraTitle.textContent = title;
    cameraStatus.textContent = "Starting...";
    photoCamera.style.display = "none";
    cameraReader.style.display = "none";
    photoGallery.style.display = "none";
    photoGallery.replaceChildren();
}

async function startPhotoCamera() {
    await stopCamera();

    cameraMode = "photo";
    openCameraMenu("CAMERA");

    photoCamera.style.display = "block";
    cameraStatus.textContent = "Requesting camera permission...";

    try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
            throw new Error("Camera access is not supported here.");
        }

        photoStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: cameraFacing
            },
            audio: false
        });

        photoVideo.srcObject = photoStream;
        await photoVideo.play();

        cameraStatus.textContent = "Ready to take a photo.";
    } catch (error) {
        cameraStatus.textContent =
            "Could not open camera. Check browser permissions and try again.";

        console.error("Photo camera error:", error);
        await stopCamera();
    }
}

/* #take photo */

takePhotoButton.addEventListener("click", async () => {
    if (!photoStream || !photoVideo.videoWidth) {
        cameraStatus.textContent = "Camera is not ready yet.";
        return;
    }

    try {
        photoCanvas.width = photoVideo.videoWidth;
        photoCanvas.height = photoVideo.videoHeight;

        const context = photoCanvas.getContext("2d");

        context.drawImage(
            photoVideo,
            0,
            0,
            photoCanvas.width,
            photoCanvas.height
        );

        const blob = await new Promise(resolve => {
            photoCanvas.toBlob(resolve, "image/jpeg", 0.92);
        });

        if (!blob) {
            throw new Error("Photo could not be created.");
        }

        await savePhoto(blob);

        cameraStatus.textContent = "Photo saved to Photos.";
    } catch (error) {
        console.error("Photo save error:", error);
        cameraStatus.textContent =
            "Could not save photo. Check browser storage permissions.";
    }
});

    cameraFacing =
        cameraFacing === "environment" ? "user" : "environment";

    await startPhotoCamera();
});

/* #QR and barcode scanner */

async function startCodeScanner(mode) {
    await stopCamera();

    cameraMode = mode;
    openCameraMenu(mode === "qr" ? "QR SCANNER" : "BARCODE SCANNER");

    cameraReader.style.display = "block";

    if (typeof Html5Qrcode === "undefined") {
        cameraStatus.textContent =
            "Scanner library failed to load. Check your internet connection.";
        return;
    }

    cameraStarting = true;

    try {
        const formats = mode === "qr"
            ? [Html5QrcodeSupportedFormats.QR_CODE]
            : [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.ITF,
                Html5QrcodeSupportedFormats.CODABAR
            ];

        cameraScanner = new Html5Qrcode("camera-reader", {
            formatsToSupport: formats
        });

        await cameraScanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 250, height: 180 },
                aspectRatio: 1
            },
            async decodedText => {
                if (!cameraScanner || cameraMode !== mode) return;

                await stopCamera();

                cameraMenu.style.display = "none";
                result.textContent = decodedText;
            },
            () => {
                // No code detected in this frame.
            }
        );

        cameraRunning = true;
        cameraStatus.textContent = mode === "qr"
            ? "Point at a QR code."
            : "Point at a barcode.";
    } catch (error) {
        console.error("Scanner error:", error);

        cameraStatus.textContent =
            "Could not start scanner. Check camera permissions.";

        await stopCamera();
    } finally {
        cameraStarting = false;
    }
}

/* #photos gallery */

async function showPhotos() {
    await stopCamera();

    cameraMode = "photos";
    openCameraMenu("PHOTOS");
    cameraStatus.textContent = "Loading saved photos...";
    photoGallery.style.display = "grid";

    try {
        const photos = await getSavedPhotos();

        if (!photos.length) {
            photoGallery.style.display = "block";
            cameraStatus.textContent = "No saved photos yet.";
            return;
        }

        cameraStatus.textContent =
            photos.length + (photos.length === 1
                ? " saved photo."
                : " saved photos.");

        photos.sort((a, b) => b.id - a.id);

        for (const photo of photos) {
            const card = document.createElement("div");
            card.className = "photo-card";

            const image = document.createElement("img");
            const imageURL = URL.createObjectURL(photo.blob);

            image.src = imageURL;
            image.alt = "Saved photo";

            const downloadButton = document.createElement("button");
            downloadButton.type = "button";
            downloadButton.textContent = "Download";

            downloadButton.addEventListener("click", () => {
                const link = document.createElement("a");
                link.href = imageURL;
                link.download = "master-lock-photo-" + photo.id + ".jpg";
                link.click();
            });

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", async () => {
                try {
                    await deleteSavedPhoto(photo.id);
                    URL.revokeObjectURL(imageURL);
                    await showPhotos();
                } catch (error) {
                    cameraStatus.textContent = "Could not delete photo.";
                    console.error(error);
                }
            });

            card.append(image, downloadButton, deleteButton);
            photoGallery.appendChild(card);
        }
    } catch (error) {
        console.error("Gallery error:", error);
        cameraStatus.textContent =
            "Could not load photos. Browser storage may be unavailable.";
    }
}

/* #stop camera */

async function stopCamera() {
    if (cameraScanner) {
        const scanner = cameraScanner;
        cameraScanner = null;

        try {
            if (cameraRunning) {
                await scanner.stop();
            }
        } catch (error) {
            console.warn("Scanner stop:", error);
        }

        try {
            await scanner.clear();
        } catch (error) {
            console.warn("Scanner cleanup:", error);
        }
    }

    cameraRunning = false;

    if (photoStream) {
        photoStream.getTracks().forEach(track => track.stop());
        photoStream = null;
    }

    photoVideo.srcObject = null;
}

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let listening = false;

if (SpeechRecognition) {

    mic.addEventListener("click", function() {

        console.log("MIC BUTTON CLICKED");

        if (listening) {

            console.log("STOPPING");

            if (recognition) {
                recognition.stop();
            }

            return;
        }

        console.log("CREATING RECOGNITION");

        recognition = new SpeechRecognition();

        recognition.lang = "en-GB";
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = function() {

            listening = true;

            mic.textContent = "Listening...";

            console.log("MICROPHONE STARTED");

        };

       


recognition.onresult = event => {
    let finalTranscript = "";
    let interimTranscript = "";

    for (let i = 0; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;

        if (event.results[i].isFinal) {
            finalTranscript += transcript;
        } else {
            interimTranscript += transcript;
        }
    }

    input.value = finalTranscript + interimTranscript;

    // #voice command execution
    if (finalTranscript.trim()) {
        const spokenText = finalTranscript.trim();

        if (/^go to\s+/i.test(spokenText)) {
            const command = spokenText
                .replace(/^go to\s+/i, "")
                .trim();

            if (command) {
                input.value = command;
                recognition.stop();
                form.requestSubmit();
            }
        }
    }
};



        recognition.onerror = function(event) {

            console.error(
                "MICROPHONE ERROR:",
                event.error
            );

            listening = false;

            mic.textContent = "Listen";

        };

        recognition.onend = function() {

            console.log("MICROPHONE ENDED");

            listening = false;

            mic.textContent = "Listen";

            recognition = null;

        };

        try {

            recognition.start();

            console.log("STARTING");

        } catch (error) {

            console.error(
                "START ERROR:",
                error
            );

            listening = false;

            mic.textContent = "Listen";

            recognition = null;

        }

    });

} else {

}

input.addEventListener("keydown", event => {

    if (event.key === "ArrowUp") {

        event.preventDefault();

        if (commandHistory.length === 0) {
            return;
        }

        historyIndex = Math.max(0, historyIndex - 1);

        input.value = commandHistory[historyIndex];

    }

    else if (event.key === "ArrowDown") {

        event.preventDefault();

        if (commandHistory.length === 0) {
            return;
        }

        historyIndex = Math.min(
            commandHistory.length,
            historyIndex + 1
        );

        input.value = historyIndex === commandHistory.length
            ? ""
            : commandHistory[historyIndex];

    }

    else if (event.key === "Escape") {

        input.value = "";
        historyIndex = commandHistory.length;

    }

});
